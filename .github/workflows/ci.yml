name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm pack --dry-run
      - name: Packed package smoke test
        run: |
          npm pack --ignore-scripts
          npm install --global ./behavior-lock-0.2.0.tgz --ignore-scripts
          behavior-lock --help
          behavior-lock --version
      - name: CLI smoke test
        run: |
          node dist/cli.js --help
          node dist/cli.js --version
      - name: Self-dogfood
        run: node dist/cli.js verify
