name: v0.2.0 published package verification

on:
  push:
    branches: [release/v0.2-auth-diagnostic]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Verify public registry metadata
        shell: bash
        run: |
          set -euo pipefail
          test "$(npm view behavior-lock@0.2.0 version)" = "0.2.0"
          test "$(npm view behavior-lock@0.2.0 name)" = "behavior-lock"
          npm view behavior-lock@0.2.0 dist.integrity repository.url
      - name: Clean install and CLI smoke
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/published-package-smoke"
          cd "$RUNNER_TEMP/published-package-smoke"
          npm init -y >/dev/null
          npm install --save-dev behavior-lock@0.2.0 --ignore-scripts
          test "$(npx --no-install behavior-lock --version)" = "0.2.0"
          npx --no-install behavior-lock --help >/dev/null
          npm audit signatures
