name: v0.2.0 auth diagnostic

on:
  push:
    branches: [release/v0.2-auth-diagnostic]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Confirm npm package remains unpublished
        shell: bash
        run: |
          set -euo pipefail
          if version="$(npm view behavior-lock@0.2.0 version 2>/dev/null)"; then
            echo "::error::behavior-lock@$version is already published"
            exit 20
          fi
          if name="$(npm view behavior-lock name 2>/dev/null)"; then
            echo "::error::npm package name is already registered as $name"
            exit 21
          fi
          echo "REGISTRY_STATE=UNPUBLISHED"
      - name: Check NPM_TOKEN availability without exposing value
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "TOKEN_AVAILABLE=false"
            exit 22
          fi
          echo "TOKEN_AVAILABLE=true"

# rerun after NPM_TOKEN was updated
