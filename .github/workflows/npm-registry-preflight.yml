name: npm registry preflight

on:
  pull_request:

permissions:
  contents: read

jobs:
  registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Check current public package state
        shell: bash
        run: |
          if version="$(npm view behavior-lock version 2>/tmp/behavior-lock-npm-error.txt)"; then
            echo "behavior-lock is already published at version: ${version}"
          else
            echo "behavior-lock is not currently published in the public npm registry."
            cat /tmp/behavior-lock-npm-error.txt
          fi
